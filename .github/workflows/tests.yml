name: Tests

on:
  push:
  pull_request:

# The tests only need to read the code, so the job's GitHub token can't push or change anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --cov=src --cov=api --cov-report=term-missing
